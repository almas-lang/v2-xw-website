name: Publish blog 2 (scheduled Oct 5)

on:
  schedule:
    # 03:30 UTC = 09:00 IST on Oct 5
    - cron: '30 3 5 10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-apply blog 2 and remove this workflow
        run: |
          if grep -q "pm-credit-design-work" src/data/blogPosts.ts; then
            echo "Blog 2 already live; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git revert --no-commit bfb04308f83006816ec75d68a94f1fb06ae462af
          git rm -q -f .github/workflows/publish-blog2.yml
          git commit -m "feat(blog): publish 'Why PMs Get Credit for Your Design Work' (scheduled Oct 5)"
          git push origin main
